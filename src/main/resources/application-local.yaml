spring:
  application:
    name: cafe
  datasource:
    url: jdbc:mysql://localhost:3306/cafe
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  data:
    redis:
      port: 6379
      host: localhost
  kafka:
    bootstrap-servers: localhost:9092, localhost9093, localhost:9094